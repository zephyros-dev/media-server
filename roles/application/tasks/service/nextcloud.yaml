- name: Create container {{ application_name }}
  ansible.builtin.include_tasks:
    file: container_quadlet.yaml

- name: Setup php nextcloud
  vars:
    nextcloud_app_command: podman exec --user www-data nextcloud-web php occ
  block:
    # occ is unusable until the image entrypoint has finished copying the
    # nextcloud sources into the volume on first start
    - name: Get nextcloud status
      changed_when: false
      ansible.builtin.command:
        cmd: "{{ nextcloud_app_command }} status --output=json"
      register: nextcloud_status
      until: nextcloud_status.rc == 0
      retries: 60
      delay: 5

    # Fresh host (e.g. a rebuilt staging): install unattended instead of
    # leaving the instance at the web installer
    - name: Install nextcloud
      when: not (nextcloud_status.stdout | regex_search('\{.*\}') | from_json).installed
      changed_when: true
      # -e nextcloud_install_debug=true to see why an install failed
      no_log: "{{ not (nextcloud_install_debug | default(false) | bool) }}"
      ansible.builtin.command:
        cmd: >-
          {{ nextcloud_app_command }} maintenance:install
          --database pgsql
          --database-host localhost:5432
          --database-name nextcloud
          --database-user postgres
          --database-pass '{{ nextcloud_postgres_password }}'
          --admin-user '{{ nextcloud_admin_user }}'
          --admin-pass '{{ nextcloud_admin_password }}'

    - name: Upgrade nextcloud
      changed_when: false
      ansible.builtin.command:
        cmd: "{{ nextcloud_app_command }} {{ item }}"
      loop:
        - upgrade
        - maintenance:mode --off
        - app:update --all
        - background:cron
        - db:add-missing-indices
        - config:system:set maintenance_window_start --type=integer --value=6
        - config:system:set trusted_domains 0 --value='nextcloud.{{ server_domain }}'

    - name: Get IP address for setting trusted_proxies nextcloud
      containers.podman.podman_network_info:
        name: podman-default-kube-network
      register: podman_network_info

    - name: Set system configuration for nextcloud
      changed_when: false
      ansible.builtin.command:
        cmd: "{{ nextcloud_app_command }} config:system:set {{ item }}"
      loop:
        - maintenance_window_start --type=integer --value=6
        - trusted_domains 0 --value='nextcloud.{{ server_domain }}'
        - trusted_proxies 0 --value='{{ podman_network_info.networks[0].subnets[0].subnet }}'

    - name: Setup nextcloud app
      ansible.builtin.include_tasks:
        file: nextcloud_app_setup.yaml
      loop_control:
        loop_var: nextcloud_app_loop_var
      loop: "{{ nextcloud_app | dict2items }}"
      vars:
        nextcloud_app:
          bookmarks: {}
          richdocuments:
            config:
              public_wopi_url: https://nextcloud-office.{{ server_domain }}
              wopi_allowlist: 0.0.0.0/0
              wopi_url: https://nextcloud-office.{{ server_domain }}
          tasks: {}
        nextcloud_app_default:
          state: present
          config: {}
