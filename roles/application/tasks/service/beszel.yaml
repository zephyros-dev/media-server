- name: Create container {{ application_name }}
  ansible.builtin.include_tasks:
    file: container_quadlet.yaml

# Connect the agent to the hub without the web UI: the agent's token is generated ahead
# in beszel.sops.yaml and enabled here as a permanent universal token, and the hub's public
# key (only known once it has started) is written to the file the agent reads (KEY_FILE)
- name: Setup beszel agent
  vars:
    beszel_api: http://localhost:8090/api
    beszel_auth_header:
      Authorization: "{{ beszel_auth.json.token }}"
  block:
    - name: Wait for beszel hub
      ansible.builtin.uri:
        url: "{{ beszel_api }}/health"
      register: beszel_health
      until: beszel_health.status == 200
      retries: 60
      delay: 5

    # The first user, created by the hub from USER_EMAIL/USER_PASSWORD
    - name: Log in to beszel hub
      no_log: true
      ansible.builtin.uri:
        url: "{{ beszel_api }}/collections/users/auth-with-password"
        method: POST
        body_format: json
        body:
          identity: admin@{{ server_domain }}
          password: "{{ beszel_user_password }}"
      register: beszel_auth

    - name: Get beszel hub public key
      no_log: true
      ansible.builtin.uri:
        url: "{{ beszel_api }}/beszel/getkey"
        headers: "{{ beszel_auth_header }}"
      register: beszel_key

    - name: Write beszel hub public key for the agent
      ansible.builtin.copy:
        content: "{{ beszel_key.json.key }}\n"
        dest: "{{ global_volume_path }}/beszel/agent/hub_key"
        mode: "0600"
      register: beszel_key_file

    # Idempotent: upserts the user's permanent token with this value
    - name: Enable beszel agent universal token
      no_log: true
      changed_when: false
      ansible.builtin.uri:
        url: "{{ beszel_api }}/beszel/universal-token?enable=1&permanent=1&token={{ beszel_agent_token | urlencode }}"
        headers: "{{ beszel_auth_header }}"

    # The agent only reads its key at startup (until the key exists it keeps exiting)
    - name: Restart beszel to load the hub key # noqa: no-handler
      when: beszel_key_file is changed
      ansible.builtin.systemd:
        name: "{{ application_name }}"
        scope: "{{ container_systemd_scope }}"
        state: restarted
