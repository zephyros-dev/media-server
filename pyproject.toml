[project]
name = "infra"
version = "0.1.0"
description = "Code for running self-hosted services using podman and pyinfra"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "pyinfra>=3",
]

[tool.uv]
cache-dir = "./.uv_cache"
python-preference = "managed"

[dependency-groups]
dev = ["podman-compose>=1.5.0"]
