name: Deployment
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deployment.yaml
      - "!submodules/zapret"
      - cue/**
      - dependencies.yaml
      - deploy/**
      - mise*.toml
      - mise-tasks/**
      - pyproject.toml
      - secret/**
      - submodules/**
      - uv.lock
permissions:
  contents: read
jobs:
  deploy:
    concurrency: deployment
    name: Deploy to server
    runs-on: ubuntu-latest
    env:
      DEBUG_MODE: ${{ vars.DEBUG_MODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Install mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
      - name: Setup CI dependencies
        run: mise run setup
      - name: Setup tmate session
        if: env.DEBUG_MODE == 'true'
        uses: mxschmitt/action-tmate@v3
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Set up WireGuard
        run: |
          set -x
          sudo apt update && sudo apt install wireguard
          eval $(mise activate --shims)
          sops -d secret/deployment/wg0.sops.ini | sudo tee /etc/wireguard/wg0.conf > /dev/null
          wg-quick up wg0
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Setup server
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          # -y: pyinfra otherwise asks before applying the changes
          command: mise run deploy -y
          on_retry_command: mise run deploy-retry
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
