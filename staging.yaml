- name: Start staging VM
  hosts: server
  gather_facts: false
  tasks:
    # always, so it also runs for `--tags <app>`; skipped when only stopping.
    # A no-op (ok, not changed) when the VM is already running
    - name: Start staging VM
      tags: always
      when: ansible_run_tags | list != ['stop']
      community.libvirt.virt:
        uri: qemu:///system
        name: staging
        state: running
      register: staging_vm_start

# Only runs when asked for, with `--tags stop`
- name: Stop staging VM
  hosts: server
  gather_facts: false
  tags: [never, stop]
  tasks:
    - name: Stop staging VM
      community.libvirt.virt:
        uri: qemu:///system
        name: staging
        state: shutdown

- name: Setup staging
  hosts: staging
  # Facts are gathered once the VM is reachable, it may still be booting
  gather_facts: false
  vars:
    debug: false
  pre_tasks:
    # `--tags stop` alone only shuts the VM down; skip the always-tagged setup tasks
    - name: Skip setup when only stopping
      tags: always
      # ansible_run_tags is a tuple, so compare as a list
      when: ansible_run_tags | list == ['stop']
      ansible.builtin.meta: end_play
    # Only after a fresh start. Checks sshd from the controller, without logging in.
    # Not a handler: the start happens in another play, on another host
    - name: Wait for staging sshd after starting it # noqa: no-handler
      tags: always
      when: hostvars[groups['server'][0]].staging_vm_start is changed
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        search_regex: OpenSSH
        timeout: 600
    - name: Gather facts
      tags: always
      ansible.builtin.setup:
  tasks:
    - name: Setup partition
      ansible.builtin.import_role:
        name: partition
    - name: Setup server
      ansible.builtin.import_role:
        name: managed_node
    - name: Setup applicaiton
      ansible.builtin.import_role:
        name: application
